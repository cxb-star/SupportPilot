name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (mock, no LLM key needed)
        run: |
          mkdir -p data
          python -m pytest tests/test_agent_ci.py -v --tb=short

      - name: Run eval (mock mode, no real LLM)
        run: |
          mkdir -p data
          python -m eval.run_eval

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile agent/*.py app/*.py store/*.py rag/*.py llm.py config.py guardrails.py monitoring.py compat.py
          echo "syntax ok"
