<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>工单管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#f5f6fa; --card:#fff; --border:#e4e7ee; --text:#1a1a2e; --muted:#6b7280; --primary:#3b5bdb; --danger:#e74c3c; --warning:#f39c12; --success:#27ae60; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Segoe UI","PingFang SC",sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
    .topbar { background:var(--card); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
    .topbar h1 { font-size:16px; font-weight:600; }
    .topbar nav { display:flex; gap:14px; margin-left:auto; }
    .topbar nav a { font-size:13px; color:var(--primary); text-decoration:none; font-weight:500; }
    .topbar nav a:hover { text-decoration:underline; }
    .filters { padding:16px 24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; max-width:1000px; margin:0 auto; }
    .filters select, .filters input { border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:13px; outline:none; font-family:inherit; }
    .filters select:focus, .filters input:focus { border-color:var(--primary); }
    .btn { background:var(--primary); color:#fff; border:none; border-radius:6px; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; }
    .btn:hover { opacity:0.9; }
    .btn-sm { padding:5px 10px; font-size:12px; }
    .table-wrap { max-width:1000px; margin:0 auto 24px; padding:0 24px; }
    table { width:100%; background:var(--card); border:1px solid var(--border); border-radius:8px; border-collapse:separate; border-spacing:0; overflow:hidden; }
    th { background:#f8f9fb; font-size:12px; color:var(--muted); font-weight:600; text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); }
    td { padding:10px 14px; border-bottom:1px solid #f0f1f5; font-size:13px; vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; font-weight:500; }
    .tag-open { background:#fde8e8; color:var(--danger); }
    .tag-in_progress { background:#fff3cd; color:#856404; }
    .tag-closed { background:#d4edda; color:#155724; }
    .tag-urgent { background:#fde8e8; color:var(--danger); font-weight:700; }
    .tag-high { background:#fff3cd; color:#856404; }
    .tag-normal { background:#eef2ff; color:var(--primary); }
    .tag-low { background:#f0f1f5; color:var(--muted); }
    .team { font-size:12px; color:var(--muted); }
    .no-data { text-align:center; color:#bbb; padding:40px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>工单管理</h1>
    <nav>
      <a href="/">问答台</a>
      <a href="/tickets-page">工单管理</a>
      <a href="/monitoring-page">监控中心</a>
      <a href="/sessions-page">会话回放</a>
      <a href="/evals-page">评估管理</a>
    </nav>
  </div>
  <div class="filters">
    <select id="f-status">
      <option value="">全部状态</option>
      <option value="open">open</option>
      <option value="in_progress">in_progress</option>
      <option value="closed">closed</option>
    </select>
    <select id="f-team">
      <option value="">全部团队</option>
      <option value="general">general</option>
      <option value="refund">refund</option>
      <option value="logistics">logistics</option>
      <option value="technical">technical</option>
    </select>
    <input id="f-no" placeholder="工单号…" style="width:140px" />
    <button class="btn" onclick="loadTickets()">查询</button>
    <button class="btn" onclick="document.getElementById('f-status').value='';document.getElementById('f-team').value='';document.getElementById('f-no').value='';loadTickets()" style="background:var(--muted)">重置</button>
  </div>
  <div class="table-wrap">
    <table id="ticket-table">
      <thead>
        <tr><th>工单号</th><th>问题摘要</th><th>状态</th><th>优先级</th><th>团队</th><th>负责人</th><th>创建时间</th><th>操作</th></tr>
      </thead>
      <tbody id="ticket-body"><tr><td colspan="8" class="no-data">加载中…</td></tr></tbody>
    </table>
  </div>
  <script>
    async function loadTickets() {
      const status = document.getElementById('f-status').value;
      const team = document.getElementById('f-team').value;
      const no = document.getElementById('f-no').value.trim();
      const tbody = document.getElementById('ticket-body');
      try {
        let url = '/tickets?limit=100';
        if (status) url += '&status=' + status;
        if (team) url += '&team=' + team;
        const r = await fetch(url);
        const d = await r.json();
        let tickets = d.tickets || [];
        if (no) tickets = tickets.filter(t => t.ticket_no && t.ticket_no.toLowerCase().includes(no.toLowerCase()));
        if (!tickets.length) { tbody.innerHTML = '<tr><td colspan="8" class="no-data">暂无工单</td></tr>'; return; }
        tbody.innerHTML = tickets.map(t => {
          const stCls = t.status === 'open' ? 'tag-open' : t.status === 'in_progress' ? 'tag-in_progress' : 'tag-closed';
          const prCls = t.priority === 'urgent' ? 'tag-urgent' : t.priority === 'high' ? 'tag-high' : t.priority === 'low' ? 'tag-low' : 'tag-normal';
          const nextActions = t.status === 'open'
            ? ['<button class="btn btn-sm" onclick="setStatus(\'' + t.ticket_no + '\',\'in_progress\')">开始处理</button>', '<button class="btn btn-sm" style="background:var(--success)" onclick="setStatus(\'' + t.ticket_no + '\',\'closed\')">关闭</button>']
            : ['<button class="btn btn-sm" style="background:var(--success)" onclick="setStatus(\'' + t.ticket_no + '\',\'closed\')">关闭</button>'];
          return '<tr>' +
            '<td style="font-family:monospace;font-size:12px">' + t.ticket_no + '</td>' +
            '<td style="max-width:200px">' + (t.question || t.title || '') + '</td>' +
            '<td><span class="tag ' + stCls + '">' + t.status + '</span></td>' +
            '<td><span class="tag ' + prCls + '">' + (t.priority || '-') + '</span></td>' +
            '<td class="team">' + (t.team || '-') + '</td>' +
            '<td class="team">' + (t.assignee || '未指派') + '</td>' +
            '<td class="team">' + (t.created_at ? t.created_at.slice(0,16) : '-') + '</td>' +
            '<td>' + nextActions.join(' ') + '</td>' +
            '</tr>';
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="8" class="no-data" style="color:var(--danger)">加载失败：' + e.message + '</td></tr>';
      }
    }
    async function setStatus(no, newStatus) {
      try {
        const r = await fetch('/tickets/' + no + '/status', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ new_status: newStatus })
        });
        if (!r.ok) { const d = await r.json(); alert(d.detail || '操作失败'); return; }
        loadTickets();
      } catch (e) { alert('请求失败：' + e.message); }
    }
    loadTickets();
  </script>
</body>
</html>
