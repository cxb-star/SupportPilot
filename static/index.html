<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>SupportPilot 客服护航台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f5f6fa; --card: #fff; --border: #e4e7ee;
      --text: #1a1a2e; --muted: #6b7280; --primary: #3b5bdb;
      --success: #27ae60; --warning: #f39c12; --danger: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI","PingFang SC",sans-serif; background:var(--bg); color:var(--text); font-size:14px; }

    .topbar {
      background:var(--card); border-bottom:1px solid var(--border);
      padding:14px 24px; display:flex; align-items:center; gap:12px;
      position:sticky; top:0; z-index:10;
    }
    .topbar h1 { font-size:16px; font-weight:600; }
    .badge { font-size:11px; padding:3px 8px; border-radius:10px; background:#f0f1f5; color:var(--muted); }
    .topbar nav { display:flex; gap:14px; margin-left:auto; }
    .topbar nav a { font-size:12px; color:var(--primary); text-decoration:none; font-weight:500; }
    .topbar nav a:hover { text-decoration:underline; }

    .main { display:flex; gap:0; max-width:900px; margin:24px auto; }

    .input-panel { flex:1; }
    .input-card {
      background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px;
    }
    .input-card label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; font-weight:600; }
    .input-card textarea {
      width:100%; border:1px solid var(--border); border-radius:6px; padding:10px;
      font-size:14px; resize:vertical; min-height:80px; outline:none; font-family:inherit;
    }
    .input-card textarea:focus { border-color:var(--primary); }
    .btn-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .btn-primary {
      background:var(--primary); color:#fff; border:none; border-radius:6px;
      padding:8px 20px; font-size:13px; font-weight:600; cursor:pointer;
    }
    .btn-primary:hover { opacity:0.9; }
    .btn-secondary {
      background:#f0f1f5; color:var(--text); border:1px solid var(--border); border-radius:6px;
      padding:8px 14px; font-size:12px; cursor:pointer;
    }
    .btn-secondary:hover { background:#e8eaf2; }

    .result-panel { flex:1.2; margin-left:16px; }
    .result-card {
      background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px;
      min-height:200px; max-height:calc(100vh - 120px); overflow-y:auto;
    }
    .placeholder { color:#bbb; font-size:14px; padding:20px; }
    .result-ans { font-size:14px; line-height:1.7; white-space:pre-wrap; margin-bottom:12px; }
    .result-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .meta-tag { font-size:11px; padding:2px 8px; border-radius:8px; background:#f0f1f5; color:var(--muted); }
    .meta-tag.conf-high { background:#d4edda; color:#155724; }
    .meta-tag.conf-low { background:#fde8e8; color:var(--danger); }
    .meta-tag.intent { background:#eef2ff; color:var(--primary); }
    .sources { margin-top:10px; }
    .sources h4 { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .source-item { font-size:12px; padding:6px 8px; background:#f8f9fb; border-radius:4px; margin-bottom:4px; color:#555; }
    .session-id { font-size:11px; color:#aaa; margin-top:10px; font-family:monospace; word-break:break-all; }
    .loading { display:flex; align-items:center; gap:10px; padding:18px 0; }
    .spinner { width:18px; height:18px; border:2px solid #e4e7ee; border-top-color:#3b5bdb; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { font-size:14px; color:#888; }
    @media (max-width:700px) { .main { flex-direction:column; } .result-panel { margin-left:0; margin-top:16px; } }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>SupportPilot 客服护航台</h1>
    <span class="badge" id="mode-badge">连接中…</span>
    <nav>
      <a href="/" style="font-size:12px;color:#666;text-decoration:none;font-weight:600">问答台</a>
      <a href="/tickets-page" style="font-size:12px;color:#3b5bdb;text-decoration:none;font-weight:600">工单管理</a>
      <a href="/monitoring-page" style="font-size:12px;color:#3b5bdb;text-decoration:none;font-weight:600">监控中心</a>
      <a href="/sessions-page" style="font-size:12px;color:#3b5bdb;text-decoration:none;font-weight:600">会话回放</a>
      <a href="/evals-page" style="font-size:12px;color:#3b5bdb;text-decoration:none;font-weight:600">评估管理</a>
    </nav>
  </div>
  <div class="main">
    <div class="input-panel">
      <div class="input-card">
        <label>问题</label>
        <textarea id="q">订单 12345 能退款吗，买了 3 天</textarea>
        <div class="btn-row">
          <button class="btn-primary" id="ask-btn" onclick="ask()">提问</button>
          <button class="btn-secondary" onclick="fill('收到的商品有破损，怎么赔')">破损示例</button>
          <button class="btn-secondary" onclick="fill('双11 满减规则是什么')">活动示例</button>
          <button class="btn-secondary" onclick="fill('帮我转人工')">转人工示例</button>
        </div>
      </div>
    </div>
    <div class="result-panel" id="result-panel">
      <div class="result-card" id="result-card">
        <div class="placeholder">提问后结果将显示在这里</div>
      </div>
    </div>
  </div>
  <script>
    const qEl = document.getElementById('q');
    const btn = document.getElementById('ask-btn');
    const card = document.getElementById('result-card');
    let currentSessionId = null;

    function fill(q) { qEl.value = q; qEl.focus(); }

    async function checkMode() {
      try {
        const r = await fetch('/health');
        const d = await r.json();
        const badge = document.getElementById('mode-badge');
        badge.textContent = d.llm_configured ? 'LLM 已配置' : 'Mock 模式';
        badge.style.background = d.llm_configured ? '#d4edda' : '#fde8e8';
        badge.style.color = d.llm_configured ? '#155724' : '#e74c3c';
      } catch { document.getElementById('mode-badge').textContent = '连接失败'; }
    }

    async function ask() {
      const question = qEl.value.trim();
      if (!question) return;
      card.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">正在处理…</div></div>';
      btn.disabled = true;
      try {
        let res;
        if (currentSessionId) {
          res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ question, session_id: currentSessionId })
          });
        } else {
          res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ question })
          });
        }
        const d = await res.json();
        if (d.session_id) currentSessionId = d.session_id;
        render(d);
      } catch (e) {
        card.innerHTML = '<div class="placeholder" style="color:#e74c3c">请求失败：' + e.message + '</div>';
      } finally { btn.disabled = false; }
    }

    function render(d) {
      const confClass = d.confidence >= 0.6 ? 'conf-high' : 'conf-low';
      const confLabel = d.confidence >= 0.6 ? '置信度 ' + Math.round(d.confidence*100) + '%' : '低置信度 ' + Math.round(d.confidence*100) + '%';
      const sourcesHtml = d.sources && d.sources.length
        ? '<div class="sources"><h4>参考来源</h4>' + d.sources.map(s => '<div class="source-item">' + (s.doc_title || s.title || s.doc_id || JSON.stringify(s)) + '</div>').join('') + '</div>'
        : '';
      const ticketHtml = d.created_ticket
        ? '<div class="meta-tag" style="background:#fde8e8;color:#e74c3c">已创建工单 → ' + (d.ticket_no || '查看工单管理') + '</div>'
        : '';
      card.innerHTML =
        '<div class="result-meta">' +
        '  <div class="meta-tag intent">意图：' + d.intent + '</div>' +
        '  <div class="meta-tag ' + confClass + '">' + confLabel + '</div>' +
        '  ' + ticketHtml +
        '</div>' +
        '<div class="result-ans">' + d.answer + '</div>' +
        sourcesHtml +
        '<div class="session-id">session: ' + d.session_id + '</div>';
    }

    checkMode();
  </script>
</body>
</html>
