<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>SupportPilot 客服护航台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", "PingFang SC", sans-serif; background: #f5f6fa; color: #1a1a2e; }
    .topbar {
      background: #fff; border-bottom: 1px solid #e4e7ee;
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar h1 { font-size: 17px; font-weight: 600; }
    .topbar .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #eef2ff; color: #3b5bdb; font-weight: 500; }
    .main { display: flex; max-width: 960px; margin: 0 auto; padding: 24px 16px; gap: 20px; min-height: calc(100vh - 57px); }
    .input-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .input-card { background: #fff; border: 1px solid #e4e7ee; border-radius: 10px; padding: 18px; }
    .input-card label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 80px; border: 1px solid #d0d5e2; border-radius: 7px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; }
    textarea:focus { border-color: #3b5bdb; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { border: none; border-radius: 7px; padding: 9px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.8; }
    .btn-primary { background: #3b5bdb; color: #fff; }
    .btn-primary:disabled { background: #b3b9e8; cursor: not-allowed; }
    .btn-secondary { background: #f0f1f5; color: #444; }
    .result-panel { flex: 1.4; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .placeholder { background: #fff; border: 1px dashed #d0d5e2; border-radius: 10px; padding: 40px; text-align: center; color: #999; font-size: 14px; flex: 1; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border: 1px solid #e4e7ee; border-radius: 10px; padding: 18px; }
    .card-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .answer-text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
    .status-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: 20px; }
    .chip-label { color: #888; }
    .chip-value { font-weight: 600; }
    .chip-refund { background: #e6f7e9; } .chip-refund .chip-value { color: #1d7a36; }
    .chip-return { background: #e6f7e9; } .chip-return .chip-value { color: #1d7a36; }
    .chip-reship { background: #e6f7e9; } .chip-reship .chip-value { color: #1d7a36; }
    .chip-compensate { background: #fff8e1; } .chip-compensate .chip-value { color: #b45309; }
    .chip-promo { background: #eef2ff; } .chip-promo .chip-value { color: #3b5bdb; }
    .chip-ticket { background: #fde8e8; } .chip-ticket .chip-value { color: #c0392b; }
    .chip-clarify { background: #fff8e1; } .chip-clarify .chip-value { color: #b45309; }
    .chip-ok { background: #e6f7e9; } .chip-ok .chip-value { color: #1d7a36; }
    .chip-no { background: #f5f5f5; } .chip-no .chip-value { color: #666; }
    .chip-mode { background: #eef2ff; } .chip-mode .chip-value { color: #3b5bdb; }
    .chip-priority-urgent { background: #fde8e8; } .chip-priority-urgent .chip-value { color: #c0392b; }
    .chip-priority-normal { background: #f5f5f5; } .chip-priority-normal .chip-value { color: #666; }
    .chip-team { background: #f0f1f5; } .chip-team .chip-value { color: #444; }
    .conf-bar { display: flex; align-items: center; gap: 10px; }
    .conf-track { flex: 1; height: 7px; background: #eef0f5; border-radius: 4px; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 4px; transition: width: 0.4s; }
    .conf-fill-high { background: #27ae60; } .conf-fill-mid { background: #f39c12; } .conf-fill-low { background: #e74c3c; }
    .conf-num { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; }
    .source-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #f0f1f5; border-radius: 7px; margin-bottom: 6px; }
    .source-item:last-child { margin-bottom: 0; }
    .source-badge { font-size: 11px; font-weight: 700; background: #eef2ff; color: #3b5bdb; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
    .source-file { font-size: 13px; color: #444; flex: 1; }
    .source-score { font-size: 12px; color: #888; font-weight: 600; min-width: 48px; text-align: right; }
    .trace-list { list-style: none; }
    .trace-item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; position: relative; }
    .trace-item:not(:last-child)::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: -6px; width: 1px; background: #e4e7ee; }
    .trace-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3b5bdb; background: #fff; flex-shrink: 0; margin-top: 2px; }
    .trace-item.skipped .trace-dot { border-color: #ccc; }
    .trace-item.fallback .trace-dot { border-color: #e74c3c; background: #fde8e8; }
    .trace-label { font-size: 13px; color: #444; }
    .trace-item.skipped .trace-label { color: #aaa; }
    .trace-item.fallback .trace-label { color: #c0392b; }
    .trace-item .ts { font-family: monospace; font-size: 11px; color: #bbb; margin-left: 6px; }
    .session-id { font-size: 11px; color: #aaa; margin-top: 10px; font-family: monospace; word-break: break-all; }
    .loading { display: flex; align-items: center; gap: 10px; padding: 18px 0; }
    .spinner { width: 18px; height: 18px; border: 2px solid #e4e7ee; border-top-color: #3b5bdb; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #888; }
    @media (max-width: 700px) { .main { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>SupportPilot 客服护航台</h1>
    <span class="badge" id="mode-badge">连接中…</span>
    <a href="/tickets-page" style="font-size:12px;color:#3b5bdb;text-decoration:none;margin-left:16px;font-weight:600">工单管理 →</a>
  </div>
  <div class="main">
    <div class="input-panel">
      <div class="input-card">
        <label>问题</label>
        <textarea id="q">订单 12345 能退款吗，买了 3 天</textarea>
        <div class="btn-row">
          <button class="btn-primary" id="ask-btn" onclick="ask()">提问</button>
          <button class="btn-secondary" onclick="fill('收到的商品有破损，怎么赔')">破损示例</button>
          <button class="btn-secondary" onclick="fill('双11 满减规则是什么')">活动示例</button>
          <button class="btn-secondary" onclick="fill('帮我转人工')">转人工示例</button>
        </div>
      </div>
    </div>
    <div class="result-panel" id="result-panel">
      <div class="placeholder">提问后结果将显示在这里</div>
    </div>
  </div>
  <script>
    const qEl = document.getElementById('q');
    const btn = document.getElementById('ask-btn');
    const panel = document.getElementById('result-panel');
    let currentSessionId = null;

    function fill(q) { qEl.value = q; qEl.focus(); }

    async function checkMode() {
      try {
        const r = await fetch('/health');
        const d = await r.json();
        document.getElementById('mode-badge').textContent = d.llm_configured ? 'LLM: 已配置' : 'Mock 模式';
      } catch { document.getElementById('mode-badge').textContent = '服务未连接'; }
    }
    checkMode();

    async function ask() {
      const question = qEl.value.trim();
      if (!question) return;
      btn.disabled = true;
      panel.innerHTML = '<div class="placeholder"><div class="loading"><div class="spinner"></div><div class="loading-text">Agent 处理中…</div></div></div>';
      let res;
      try {
        res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, session_id: currentSessionId })
        });
      } catch (e) {
        panel.innerHTML = '<div class="placeholder" style="color:#c0392b">服务未连接：' + e.message + '</div>';
        btn.disabled = false;
        return;
      }
      let d;
      try { d = await res.json(); } catch (_) {
        const raw = await res.text().catch(() => '');
        panel.innerHTML = '<div class="placeholder" style="color:#c0392b">后端返回状态码 ' + res.status + '，响应不是 JSON。原始内容：' + (raw || '空响应') + '</div>';
        btn.disabled = false;
        return;
      }
      currentSessionId = d.session_id;
      try { render(d); } finally { btn.disabled = false; }
    }

    function intentChip(intent) {
      const map = {
        refund:     ['chip-refund', '退款'],
        return:     ['chip-return', '退货'],
        reship:     ['chip-reship', '补发'],
        compensate: ['chip-compensate', '赔付'],
        promo:      ['chip-promo', '活动'],
        ticket:     ['chip-ticket', '转人工'],
        clarify:    ['chip-clarify', '需澄清'],
      };
      const [cls, label] = map[intent] || ['chip-no', intent];
      return `<span class="chip ${cls}"><span class="chip-label">意图</span><span class="chip-value">${label}</span></span>`;
    }

    function priorityChip(p) {
      const cls = p === 'urgent' ? 'chip-priority-urgent' : 'chip-priority-normal';
      return `<span class="chip ${cls}"><span class="chip-label">优先级</span><span class="chip-value">${p === 'urgent' ? '紧急' : '普通'}</span></span>`;
    }

    function teamChip(t) {
      const map = { aftersales: '售后组', quality: '质控组', ops: '运营组', general: '通用组' };
      return `<span class="chip chip-team"><span class="chip-label">团队</span><span class="chip-value">${map[t] || t}</span></span>`;
    }

    function ticketChip(created) {
      const cls = created ? 'chip-ticket' : 'chip-ok';
      const label = created ? '已建工单' : '未建工单';
      return `<span class="chip ${cls}"><span class="chip-label">工单</span><span class="chip-value">${label}</span></span>`;
    }

    function modeChip(mode) {
      return `<span class="chip chip-mode"><span class="chip-label">模式</span><span class="chip-value">${mode === 'api' ? 'API' : 'Mock'}</span></span>`;
    }

    function confHtml(conf) {
      const pct = Math.round(conf * 100);
      const cls = conf >= 0.7 ? 'conf-fill-high' : conf >= 0.4 ? 'conf-fill-mid' : 'conf-fill-low';
      const color = conf >= 0.7 ? '#27ae60' : conf >= 0.4 ? '#f39c12' : '#e74c3c';
      return `<div class="conf-bar"><div class="conf-track"><div class="conf-fill ${cls}" style="width:${pct}%"></div></div><div class="conf-num" style="color:${color}">${pct}%</div></div>`;
    }

    function sourcesHtml(sources) {
      if (!sources || !sources.length) return '<div style="font-size:13px;color:#aaa">无来源引用</div>';
      return sources.map(s => `<div class="source-item"><span class="source-badge">${esc(s.id || '—')}</span><span class="source-file">${esc(s.source || '未知来源')}</span><span class="source-score">${s.score != null ? (s.score * 100).toFixed(0) + '%' : '—'}</span></div>`).join('');
    }

    function traceHtml(trace) {
      if (!trace || !trace.length) return '';
      return '<ul class="trace-list">' + trace.map(t => {
        const label = t.step || String(t);
        const ts = t.ts ? `<span class="ts">${new Date(t.ts).toLocaleTimeString()}</span>` : '';
        const skipped = label.includes('skipped');
        const fallback = label.includes('fallback') || label.includes('failed');
        const cls = fallback ? 'fallback' : skipped ? 'skipped' : '';
        return `<li class="trace-item ${cls}"><div class="trace-dot"></div><span class="trace-label">${esc(label)}${ts}</span></li>`;
      }).join('') + '</ul>';
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function render(d) {
      panel.innerHTML = `
        <div class="card">
          <div class="card-title">回答</div>
          <div class="answer-text">${esc(d.answer)}</div>
        </div>
        <div class="card">
          <div class="card-title">状态</div>
          <div class="status-row">
            ${intentChip(d.intent)}
            ${ticketChip(d.created_ticket)}
            ${priorityChip(d.ticket_priority)}
            ${teamChip(d.ticket_team)}
            ${modeChip(d.mode)}
          </div>
          <div style="margin-top:14px">
            <div style="font-size:12px;color:#888;margin-bottom:6px">置信度</div>
            ${confHtml(d.confidence)}
          </div>
        </div>
        <div class="card">
          <div class="card-title">引用来源</div>
          ${sourcesHtml(d.sources)}
        </div>
        <div class="card">
          <div class="card-title">执行轨迹</div>
          ${traceHtml(d.trace)}
        </div>
        <div class="session-id">session: ${esc(d.session_id)}</div>
      `;
    }

    qEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
  </script>
</body>
</html>
